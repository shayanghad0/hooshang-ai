# .github/workflows/type-check.yml
name: Type Check (mypy)
on: [push, pull_request]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy . --ignore-missing-imports
